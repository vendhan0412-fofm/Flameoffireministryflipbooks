
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's Bible Verse</title>
</head>

<body style="text-align:center;font-family:Arial;">

<h3>Today's Bible Verse</h3>

<img id="verseImg"
     style="max-width:100%;height:auto;"
     alt="Loading Bible verse..." />

<script>
const baseURL = "https://vendhan0412-fofm.github.io/Flameoffireministryflipbooks/Word-Of-Knowledge-Daily-Images/";

const img = document.getElementById("verseImg");
const pointerURL = baseURL + "latest.txt";

function getTodayDate() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Kolkata",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const year = parts.find(p => p.type === "year").value;
  const month = parts.find(p => p.type === "month").value;
  const day = parts.find(p => p.type === "day").value;

  return `daily-${year}-${month}-${day}`;
}

function tryExtensions(filename, onFailure) {
  const extensions = ["jpg", "jpeg"];
  let index = 0;

  function tryNext() {
    if (index >= extensions.length) {
      onFailure();
      return;
    }

    const imageURL = baseURL + filename + "." + extensions[index] + "?t=" + Date.now();
    index++;

    const test = new Image();

    test.onload = function () {
      img.src = imageURL;
      img.alt = "Daily Bible Verse";
    };

    test.onerror = tryNext;

    test.src = imageURL;
  }

  tryNext();
}

async function loadDailyImage() {
  const todayFilename = getTodayDate();

  // First try today's image
  tryExtensions(todayFilename, async function () {

    // If today's image is missing, read latest.txt
    try {
      const response = await fetch(pointerURL + "?t=" + Date.now());

      if (!response.ok) {
        throw new Error("latest.txt not found");
      }

      const filename = (await response.text()).trim();

      if (!/^daily-\d{4}-\d{2}-\d{2}$/i.test(filename)) {
        throw new Error("Invalid filename");
      }

      // Try JPG and JPEG from latest.txt
      tryExtensions(filename, function () {
        img.alt = "Today's and fallback Bible verse images are unavailable.";
      });

    } catch (error) {
      img.alt = "Unable to load today's Bible verse image.";
    }
  });
}

loadDailyImage();
</script>

</body>
</html>
