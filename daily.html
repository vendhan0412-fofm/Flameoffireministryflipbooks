
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today's Bible Verse</title>
</head>

<body style="text-align:center;font-family:Arial;">

<h3>Today's Bible Verse</h3>

<img id="verseImg"
     style="max-width:100%;height:auto;"
     alt="Loading Bible verse..." />

<script>
const baseURL = "https://vendhan0412-fofm.github.io/Flameoffireministryflipbooks/Word-Of-Knowledge-Daily-Images/";

const img = document.getElementById("verseImg");
const pointerURL = baseURL + "latest.txt";

async function loadLatestImage() {
  try {
    const response = await fetch(pointerURL + "?t=" + Date.now());

    if (!response.ok) {
      throw new Error("Could not read latest.txt");
    }

    const filename = (await response.text()).trim();

    if (!/^daily-\d{4}-\d{2}-\d{2}\.(jpg|jpeg)$/i.test(filename)) {
      throw new Error("Invalid filename in latest.txt");
    }

    const imageURL = baseURL + filename + "?t=" + Date.now();
    const test = new Image();

    test.onload = function () {
      img.src = imageURL;
      img.alt = "Daily Bible Verse";
    };

    test.onerror = function () {
      img.alt = "The image listed in latest.txt could not be found.";
    };

    test.src = imageURL;

  } catch (error) {
    img.alt = "Unable to load the latest Bible verse image. Please check latest.txt.";
  }
}

loadLatestImage();
</script>

</body>
</html>
